# Build and offline checks on every push / pull request, on the distributions USM targets.
name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04", "debian:13"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends gcc make libc6-dev python3 shellcheck
      - name: Build
        run: make
      - name: Checks
        run: make check
