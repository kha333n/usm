name: 💡 Feature request
description: An idea to make USM better
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Alternatives you considered, links, whether you'd like to help build it.
